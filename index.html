<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
scroll-behavior:smooth;
}

body{

background:linear-gradient(135deg,#ffdde1,#ee9ca7);
overflow-x:hidden;

}

section{

width:100%;
height:100vh;

display:none;

justify-content:center;
align-items:center;
flex-direction:column;

text-align:center;

padding:20px;

}

#start{

}

h1{

font-size:55px;
color:white;
text-shadow:0 0 20px hotpink;

}

h2{

font-size:40px;
color:white;

}

p{

font-size:22px;
line-height:1.8;
color:white;

}

button{

margin-top:30px;

padding:18px 45px;

font-size:22px;

border:none;

border-radius:50px;

background:white;

color:#ff4081;

cursor:pointer;

transition:.3s;

font-weight:bold;

}

button:hover{

transform:scale(1.08);

}

.photo-box{

display:flex;

justify-content:center;

flex-wrap:wrap;

}

.photo{

height:400px;

object-fit:cover;

border-radius:25px;

border:8px solid white;

box-shadow:0 0 30px white;

}

.candle{

font-size:180px;

animation:glow 1s infinite alternate;

}

.cake{

font-size:220px;

}

.card{

color:#444;

padding:40px;

border-radius:30px;

max-width:900px;

font-size:22px;
