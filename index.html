<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ffdde1,#ee9ca7);
overflow-x:hidden;
color:white;
}

section{
width:100%;
min-height:100vh;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
padding:20px;
text-align:center;
}

#start{
display:flex;
}

h1{
font-size:55px;
margin-bottom:20px;
text-shadow:0 0 15px rgba(255,255,255,.7);
}

h2{
font-size:38px;
margin-bottom:20px;
}

p{
font-size:22px;
line-height:1.8;
max-width:900px;
}

button{

padding:18px 45px;
font-size:22px;
border:none;
border-radius:50px;
cursor:pointer;
margin-top:30px;
background:white;
color:#ff4081;
font-weight:bold;
transition:.3s;

}

button:hover{

transform:scale(1.08);

}

.photo-box{

display:flex;
gap:25px;
margin-top:35px;
flex-wrap:wrap;
justify-content:center;

}

.photo{

width:300px;
height:400px;
object-fit:cover;
border-radius:25px;
border:8px solid white;
box-shadow:0 0 30px rgba(255,255,255,.8);

}

.candle{

font-size:180px;
animation:glow 1s infinite alternate;

}

.cake{

font-size:220px;

}

.card{

background:white;
color:#444;
padding:40px;
border-radius:30px;
max-width:850px;
box-shadow:0 0 30px rgba(255,255,255,.7);

}

@keyframes glow{

from{
transform:scale(1);
filter:drop-shadow(0 0 10px yellow);
}

to{
transform:scale(1.08);
filter:drop-shadow(0 0 30px orange);
}

}

.heart{

position:fixed;
font-size:30px;
animation:fly 5s linear forwards;

}

@keyframes fly{

from{

transform:translateY(0);
opacity:1;

}

to{

transform:translateY(-900px);
opacity:0;

}

}

</style>
</head>
