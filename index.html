<!DOCTYPE html>
<html>
<head>
<title>Happy Birthday ❤️</title>

<style>
body{
    text-align:center;
    font-family:Arial, sans-serif;
    background:#ffe6f2;
    padding:30px;
}

h1{
    color:#ff4d88;
}

img{
    width:250px;
    height:250px;
    object-fit:cover;
    border-radius:50%;
    box-shadow:0 0 20px pink;
}

.candle{
    font-size:60px;
    animation: glow 1s infinite alternate;
}

.cake{
    font-size:80px;
}

@keyframes glow{
    from{transform:scale(1);}
    to{transform:scale(1.1);}
}

.message{
    font-size:20px;
    color:#555;
}
</style>

</head>

<body>

<h1>Happy Birthday My Love ❤️</h1>

<img src="photo.jpg">

<h2>🎂 A Small Surprise For You 🎂</h2>

<div class="candle">🕯️</div>

<div class="cake">🎂</div>

<p class="message">
Tum meri life ka bahut special hissa ho ❤️<br>
Tumhari smile hamesha aise hi bani rahe 😊<br>
Happy Birthday ❤️
</p>

</body>
    </html>
